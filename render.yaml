services:
  - type: web
    name: spotter-routing
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: TRUST_PROXY
        value: "1"
      - key: SECURE_SSL_REDIRECT
        value: "1"
